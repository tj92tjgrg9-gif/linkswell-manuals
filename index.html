<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Linkswell Radio Install Guides</title>
<style>
  :root {
    --bg: #F5F6F8;
    --surface: #FFFFFF;
    --text: #1B2330;
    --muted: #5B6575;
    --border: #E2E5EA;
    --accent: #1D4ED8;
    --accent-soft: #E8EEFC;
    --bar: #1B2330;
    --bar-text: #FFFFFF;
    --xl: #1D4ED8;
    --gen6: #0F766E;
    --lite2: #B45309;
    --warn-bg: #FFF7E6;
    --warn-text: #8A5A00;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0F141B;
      --surface: #18202B;
      --text: #E6E9EE;
      --muted: #9AA4B2;
      --border: #2A3442;
      --accent: #6E95F5;
      --accent-soft: #1E2A44;
      --bar: #0A0E13;
      --xl: #6E95F5;
      --gen6: #2DD4BF;
      --lite2: #F59E0B;
      --warn-bg: #2B2414;
      --warn-text: #F3C46B;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
    line-height: 1.45;
  }
  a { color: var(--accent); }
  header { background: var(--bar); color: var(--bar-text); padding: 28px 16px 24px; }
  .wrap { max-width: 1040px; margin: 0 auto; }
  h1 { margin: 0 0 4px; font-size: 1.6rem; font-weight: 700; letter-spacing: -0.01em; }
  header p { margin: 0; opacity: .75; }

  .finder {
    margin: 20px auto 0;
    padding: 16px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
  }
  .finder h2 { margin: 0 0 12px; font-size: 1rem; }
  .selects { display: grid; grid-template-columns: repeat(3, 1fr) auto; gap: 10px; align-items: end; }
  label { display: block; font-size: .8rem; font-weight: 600; color: var(--muted); margin-bottom: 4px; }
  select, .search {
    width: 100%;
    padding: 10px 12px;
    font: inherit;
    color: var(--text);
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
  }
  select:disabled { opacity: .5; }
  select:focus, .search:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  .reset {
    font: inherit; font-size: .9rem;
    padding: 10px 14px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text);
    cursor: pointer;
  }
  .row2 { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-top: 12px; }
  .row2 .search { flex: 1 1 240px; width: auto; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip {
    font: inherit; font-size: .875rem;
    padding: 7px 12px;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    cursor: pointer;
  }
  .chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }

  main { padding: 0 16px 48px; }
  .summary { margin: 18px 0 0; color: var(--muted); font-size: .9rem; }
  section { margin-top: 24px; }
  section > h2 { font-size: 1.1rem; margin: 0 0 12px; display: flex; align-items: center; gap: 8px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 12px; }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-left: 4px solid var(--line);
    border-radius: 10px;
    padding: 14px 16px;
    display: flex; flex-direction: column; gap: 10px;
  }
  .card h3 { margin: 0; font-size: 1rem; font-weight: 600; }
  .badge { font-size: .75rem; font-weight: 700; color: var(--line); text-transform: uppercase; letter-spacing: .04em; }
  .note { font-size: .82rem; background: var(--warn-bg); color: var(--warn-text); padding: 6px 8px; border-radius: 6px; }
  .actions { display: flex; gap: 8px; margin-top: auto; }
  .btn {
    flex: 1;
    text-align: center;
    text-decoration: none;
    font-size: .9rem; font-weight: 600;
    padding: 8px 10px;
    border-radius: 7px;
    border: 1px solid var(--accent);
  }
  .btn.primary { background: var(--accent); color: #fff; }
  .btn.ghost { color: var(--accent); background: var(--accent-soft); border-color: transparent; }
  .btn:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }
  .nomanual { flex: 1; font-size: .85rem; color: var(--muted); padding: 8px 0; }
  .links { display: flex; gap: 14px; font-size: .85rem; }
  .links a { text-decoration: none; font-weight: 600; }
  .empty { color: var(--muted); padding: 32px 0; text-align: center; }

  #firmware { margin-top: 40px; }
  #firmware > h2 { font-size: 1.25rem; }
  details.fw {
    background: var(--surface);
    border: 1px solid var(--border);
    border-left: 4px solid var(--line);
    border-radius: 10px;
    margin-top: 10px;
  }
  details.fw summary { cursor: pointer; padding: 14px 16px; font-weight: 600; }
  details.fw summary small { font-weight: 400; color: var(--muted); }
  .fw-body { padding: 0 16px 16px; }
  .fw-body h4 { margin: 14px 0 6px; font-size: .95rem; }
  .fw-body ol { margin: 0; padding-left: 20px; }
  .fw-body li { margin: 2px 0; }
  .fw-dl { display: inline-block; margin: 2px 0 6px; font-weight: 600; }
  .ver { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: .85em; background: var(--accent-soft); padding: 1px 5px; border-radius: 4px; }
  .src { font-size: .85rem; color: var(--muted); margin-top: 12px; }
  [hidden] { display: none !important; }

  @media (max-width: 640px) {
    .selects { grid-template-columns: 1fr 1fr; }
    .selects > div:first-child { grid-column: 1 / -1; }
    .reset { grid-column: 1 / -1; }
  }
</style>
</head>
<body>
<header>
  <div class="wrap">
    <h1>Linkswell Radio Install Guides</h1>
    <p>T-Style XL · Gen 6 · Lite 2: manuals, fitment and firmware</p>
  </div>

    </div>
    <div class="row2">
      <input class="search" id="q" type="search" placeholder="Or search, e.g. Tacoma, Super Duty, Ram 2019" aria-label="Search">
      <div class="chips" id="chips" role="group" aria-label="Filter by product line"></div>
    </div>
  </div>
</div>

<main class="wrap">
  <p class="summary" id="summary"></p>
  <div id="list"></div>

  <section id="firmware">

    <div id="fwlist"></div>

</main>

          steps: ["Copy both logo files to the USB drive and plug it in.",
                  "Gear icon → User → Boot animation → Sure.",
                  "Boot screen → ☰ → your USB → pick the Linkswell logo."] },
      ] },
  ];

  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const lineOf = (id) => LINES.find(l => l.id === id);
  const manualHref = (p) => encodeURI(lineOf(p.line).folder + "/" + p.manual);
  const fwOf = (id) => FIRMWARE.find(f => f.id === id);

  const state = { make: "", model: "", year: "", line: "all" };
  const uniq = (a) => [...new Set(a)];
  const allFits = PRODUCTS.flatMap(p => p.fits);

  function fillSelect(el, placeholder, values) {
    el.innerHTML = `<option value="">${placeholder}</option>` + values.map(v => `<option>${esc(v)}</option>`).join("");
    el.disabled = values.length === 0;
  }
  function refreshSelects() {
    fillSelect($("make"), "Any make", uniq(allFits.map(f => f[0])).sort());
    $("make").value = state.make;
    const models = state.make ? uniq(allFits.filter(f => f[0] === state.make).map(f => f[1])).sort() : [];
    fillSelect($("model"), "Any model", models);
    $("model").value = state.model;
    let years = [];
    if (state.make) {
      allFits.filter(f => f[0] === state.make && (!state.model || f[1] === state.model))
        .forEach(([, , a, b]) => { for (let y = a; y <= b; y++) years.push(y); });
    }
    fillSelect($("year"), "Any year", uniq(years).sort((a, b) => b - a));
    $("year").value = state.year;
  }

  function fitsVehicle(p) {
    if (!state.make) return true;
    return p.fits.some(([mk, md, a, b]) =>
      mk === state.make && (!state.model || md === state.model) && (!state.year || (+state.year >= a && +state.year <= b)));
  }
  function matchesSearch(p) {
    const terms = $("q").value.toLowerCase().split(/\s+/).filter(Boolean);
    if (!terms.length) return true;
    const years = p.fits.flatMap(([, , a, b]) => Array.from({ length: b - a + 1 }, (_, i) => a + i));
    const hay = [p.title, lineOf(p.line).name, p.manual || "", ...p.fits.map(f => f[0] + " " + f[1])].join(" ").toLowerCase();
    return terms.every(t => /^\d{4}$/.test(t) ? years.includes(+t) : hay.includes(t));
  }

  function card(p) {
    const l = lineOf(p.line);
    const fw = fwOf(p.fw);
    const manual = p.manual
      ? `<a class="btn ghost" href="${manualHref(p)}" target="_blank" rel="noopener">View manual</a>
         <a class="btn primary" href="${manualHref(p)}" download>Download</a>`
      : `<span class="nomanual">No manual on file. Check <a href="https://www.linkswellinc.com/support/install-user-manuals/" target="_blank" rel="noopener">LinksWell's manuals page</a>.</span>`;
    return `<article class="card" style="--line:${l.color}">
      <div class="badge">${esc(l.name)}</div>
      <h3>${esc(p.title)}</h3>
      ${p.note ? `<div class="note">${esc(p.note)}</div>` : ""}
      <div class="actions">${manual}</div>
      <div class="links">
        <a href="#fw-${fw.id}" data-fw="${fw.id}">Firmware: ${esc(fw.name)}</a>
        ${p.url ? `<a href="${SITE + p.url}" target="_blank" rel="noopener">Product page ↗</a>` : ""}
      </div>
    </article>`;
  }

  function render() {
    const shown = PRODUCTS.filter(p => (state.line === "all" || p.line === state.line) && fitsVehicle(p) && matchesSearch(p));
    $("list").innerHTML = LINES.map(l => {
      const items = shown.filter(p => p.line === l.id);
      if (!items.length) return "";
      return `<section><h2><span class="dot" style="background:${l.color}"></span>${esc(l.name)}</h2>
        <div class="grid">${items.map(card).join("")}</div></section>`;
    }).join("") || `<p class="empty">Nothing from XL, Gen 6 or Lite 2 fits that vehicle.</p>`;

    const make = state.model.startsWith(state.make) ? "" : state.make;
    const vehicle = [state.year, make, state.model].filter(Boolean).join(" ");
    const withManual = shown.filter(p => p.manual).length;
    $("summary").textContent = shown.length
      ? `${shown.length} product${shown.length > 1 ? "s" : ""}${vehicle ? " fit " + vehicle : ""} · ${withManual} with a manual`
      : "";
  }

  // firmware panels
  $("fwlist").innerHTML = FIRMWARE.map(f => `
    <details class="fw" id="fw-${f.id}" style="--line:${f.color}">
      <summary>${esc(f.name)} <small>· ${esc(f.asOf)}</small></summary>
      <div class="fw-body">
        <p>${esc(f.intro)}</p>
        ${f.parts.map(pt => `
          <h4>${esc(pt.h)}${pt.ver ? ` <span class="ver">${esc(pt.ver)}</span>` : ""}</h4>
          <a class="fw-dl" href="${pt.href}" target="_blank" rel="noopener">Download ${esc(pt.file)} ↗</a>
          ${pt.steps.length ? `<ol>${pt.steps.map(s => `<li>${esc(s)}</li>`).join("")}</ol>` : ""}`).join("")}
        <p class="src">Always check <a href="${f.src}" target="_blank" rel="noopener">LinksWell's firmware page</a> for newer versions before updating.</p>
      </div>
    </details>`).join("");

  document.addEventListener("click", (e) => {
    const a = e.target.closest("a[data-fw]");
    if (!a) return;
    const d = $("fw-" + a.dataset.fw);
    d.open = true;
  });

  // product line chips
  [{ id: "all", name: "All" }, ...LINES].forEach(l => {
    const b = document.createElement("button");
    b.className = "chip";
    b.type = "button";
    b.textContent = l.name;
    b.dataset.line = l.id;
    b.setAttribute("aria-pressed", l.id === "all");
    b.onclick = () => {
      state.line = l.id;
      $("chips").querySelectorAll(".chip").forEach(c => c.setAttribute("aria-pressed", c.dataset.line === l.id));
      render();
    };
    $("chips").appendChild(b);
  });

  $("make").onchange = (e) => { state.make = e.target.value; state.model = ""; state.year = ""; refreshSelects(); render(); };
  $("model").onchange = (e) => { state.model = e.target.value; state.year = ""; refreshSelects(); render(); };
  $("year").onchange = (e) => { state.year = e.target.value; render(); };
  $("q").addEventListener("input", render);
  $("reset").onclick = () => {
    Object.assign(state, { make: "", model: "", year: "" });
    $("q").value = "";
    refreshSelects(); render();
  };

  refreshSelects();
  render();
</script>
</body>
</html>
