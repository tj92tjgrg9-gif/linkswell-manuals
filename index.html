<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Linkswell Product Information</title>
<style>
  :root {
    --bg: #F5F6F8;
    --surface: #FFFFFF;
    --img-bg: #FFFFFF;
    --text: #1B2330;
    --muted: #5B6575;
    --border: #E2E5EA;
    --accent: #1D4ED8;
    --accent-soft: #E8EEFC;
    --bar: #1B2330;
    --bar-text: #FFFFFF;
    --xl: #1D4ED8;
    --gen6: #0F766E;
    --lite2: #B45309;
    --ok: #15803D;
    --ok-bg: #E9F7EE;
    --no: #B42318;
    --no-bg: #FDECEA;
    --warn-bg: #FFF7E6;
    --warn-text: #8A5A00;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0F141B;
      --surface: #18202B;
      --img-bg: #F2F3F5;
      --text: #E6E9EE;
      --muted: #9AA4B2;
      --border: #2A3442;
      --accent: #6E95F5;
      --accent-soft: #1E2A44;
      --bar: #0A0E13;
      --xl: #6E95F5;
      --gen6: #2DD4BF;
      --lite2: #F59E0B;
      --ok: #4ADE80;
      --ok-bg: #12291B;
      --no: #F87171;
      --no-bg: #2E1515;
      --warn-bg: #2B2414;
      --warn-text: #F3C46B;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
    line-height: 1.45;
  }
  a { color: var(--accent); }
  h1 { font-size: 1.5rem; line-height: 1.25; margin: 6px 0 8px; letter-spacing: -0.01em; }
  .muted { color: var(--muted); }
  .small { font-size: .85rem; }
  .strong { font-weight: 600; }
  .sku { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: .85em; }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 0 16px; }

  /* header */
  .top { background: var(--bar); color: var(--bar-text); position: sticky; top: 0; z-index: 10; }
  @media (max-width: 640px) { .top { position: static; } }
  .top .wrap { display: flex; align-items: center; gap: 16px; padding-top: 10px; padding-bottom: 10px; flex-wrap: wrap; }
  .brand { color: inherit; text-decoration: none; font-weight: 700; font-size: 1.05rem; white-space: nowrap; }
  .topnav { display: flex; gap: 4px; }
  .topnav a { color: inherit; text-decoration: none; opacity: .8; padding: 6px 10px; border-radius: 6px; font-size: .92rem; }
  .topnav a.on, .topnav a:hover { opacity: 1; background: rgba(255,255,255,.12); }
  #topsearch { flex: 1 1 220px; display: flex; }
  #topq { flex: 1; min-width: 0; padding: 8px 12px; border-radius: 8px; border: 0; font: inherit; }
  @media (max-width: 640px) { #topsearch { order: 3; flex-basis: 100%; } }

  main { padding-bottom: 56px; }
  .crumbs { font-size: .85rem; color: var(--muted); margin: 16px 0 8px; }
  .crumbs a { color: var(--muted); }

  /* buttons + form */
  .btn { display: inline-block; text-align: center; text-decoration: none; font: inherit; font-weight: 600; font-size: .95rem; padding: 10px 16px; border-radius: 8px; border: 1px solid var(--accent); cursor: pointer; }
  .btn.primary { background: var(--accent); color: #fff; }
  .btn.ghost { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
  .btn.small { padding: 6px 12px; font-size: .85rem; }
  label { font-size: .8rem; font-weight: 600; color: var(--muted); display: block; margin-bottom: 4px; }
  select { width: 100%; padding: 10px 12px; font: inherit; color: var(--text); background: var(--surface); border: 1px solid var(--border); border-radius: 8px; }
  select:disabled { opacity: .5; }

  /* vehicle bar */
  .vbar { display: grid; grid-template-columns: repeat(3, 1fr) auto; gap: 10px; align-items: end; }
  .vbar.compact { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 12px; margin-bottom: 16px; }
  @media (max-width: 640px) { .vbar { grid-template-columns: 1fr 1fr; } .vbar .vsel:first-child, .vbar .btn { grid-column: 1 / -1; } }

  /* home */
  .hero { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 24px; margin-top: 20px; }
  .hero h1 { font-size: 1.7rem; margin: 0 0 14px; }
  .h2 { font-size: 1.2rem; margin: 32px 0 12px; }
  .lines { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 14px; }
  .linecard { border-top: 4px solid var(--line) !important; }
  .support-links { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 14px; }
  .supcard { display: flex; flex-direction: column; gap: 4px; padding: 16px; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; text-decoration: none; color: var(--text); }

  /* tiles */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px; }
  .tile, .linecard { display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; text-decoration: none; color: var(--text); transition: box-shadow .15s, transform .15s; }
  .tile:hover, .linecard:hover { box-shadow: 0 6px 18px rgba(0,0,0,.12); transform: translateY(-1px); }
  .tile-img { position: relative; background: var(--img-bg); aspect-ratio: 4 / 3; overflow: hidden; }
  .tile-img img { position: absolute; inset: 6px; width: calc(100% - 12px); height: calc(100% - 12px); object-fit: contain; }
  .tile-body { padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 4px; flex: 1; }
  .tile-body h3 { margin: 2px 0; font-size: .98rem; line-height: 1.3; }
  .lbadge { align-self: flex-start; font-size: .7rem; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--line); }
  .tile-flags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: auto; padding-top: 6px; }
  .flag { font-size: .72rem; font-weight: 600; padding: 2px 7px; border-radius: 999px; background: var(--bg); color: var(--muted); }
  .flag.ok { background: var(--ok-bg); color: var(--ok); }
  .flag.warn { background: var(--warn-bg); color: var(--warn-text); }

  /* listing */
  .plp { display: grid; grid-template-columns: 230px 1fr; gap: 20px; align-items: start; }
  .filters details { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 4px 14px 12px; position: sticky; top: 72px; }
  .filters summary { cursor: pointer; font-weight: 700; padding: 10px 0; }
  .fgroup { border-top: 1px solid var(--border); padding: 10px 0; }
  .fgroup h4 { margin: 0 0 6px; font-size: .85rem; }
  .chk { display: flex; align-items: center; gap: 8px; font-size: .9rem; font-weight: 400; color: var(--text); margin: 4px 0; cursor: pointer; }
  .results-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 14px; margin-bottom: 12px; }
  .results-head h1 { margin: 0; flex-basis: 100%; }
  .sort { display: flex; align-items: center; gap: 8px; margin: 0 0 0 auto; font-weight: 400; }
  .sort select { width: auto; padding: 6px 10px; }
  .morebar { display: block; margin-top: 16px; padding: 14px 16px; background: var(--accent-soft); color: var(--accent); border-radius: 10px; text-decoration: none; font-weight: 600; }
  .empty { color: var(--muted); padding: 32px 0; text-align: center; grid-column: 1 / -1; }
  @media (max-width: 760px) {
    .plp { grid-template-columns: 1fr; }
    .filters details { position: static; }
    .grid { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 10px; }
  }

  /* product page */
  .pdp { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 28px; align-items: start; margin-top: 4px; }
  @media (max-width: 800px) { .pdp { grid-template-columns: 1fr; gap: 16px; } }
  .gallery-main { position: relative; background: var(--img-bg); border: 1px solid var(--border); border-radius: 12px; aspect-ratio: 4 / 3; overflow: hidden; }
  .gallery-main img { position: absolute; inset: 10px; width: calc(100% - 20px); height: calc(100% - 20px); object-fit: contain; }
  .thumbs { display: flex; gap: 8px; margin-top: 10px; overflow-x: auto; }
  .thumb { flex: 0 0 72px; height: 56px; padding: 0; border: 2px solid var(--border); border-radius: 8px; background: var(--img-bg); cursor: pointer; overflow: hidden; }
  .thumb.on { border-color: var(--accent); }
  .thumb img { width: 100%; height: 100%; object-fit: contain; }
  .pdp-info { display: flex; flex-direction: column; gap: 10px; }
  .pdp-info h1 { margin: 0; }
  .pdp-info p { margin: 0; }
  .fitbox { padding: 10px 12px; border-radius: 8px; font-weight: 600; }
  .fitbox.ok { background: var(--ok-bg); color: var(--ok); }
  .fitbox.no { background: var(--no-bg); color: var(--no); }
  .fits { font-size: .92rem; }
  .buy { display: flex; flex-wrap: wrap; gap: 8px; padding: 6px 0; }
  .notes { background: var(--warn-bg); color: var(--warn-text); border-radius: 10px; padding: 12px 14px; font-size: .9rem; }
  .notes ul { margin: 6px 0 0; padding-left: 18px; }
  .notes li { margin: 3px 0; }
  .jump { display: flex; flex-wrap: wrap; gap: 6px; padding-top: 4px; }
  .jump button { font: inherit; font-size: .85rem; padding: 6px 12px; border-radius: 999px; border: 1px solid var(--border); background: var(--surface); color: var(--text); cursor: pointer; }
  .psec { margin-top: 36px; scroll-margin-top: 80px; }
  .psec h2 { font-size: 1.2rem; margin: 0 0 12px; padding-bottom: 8px; border-bottom: 1px solid var(--border); }
  .psec h3 { font-size: 1rem; margin: 18px 0 6px; }
  .specs { columns: 2 320px; column-gap: 32px; margin: 0; padding-left: 18px; }
  .specs > li { break-inside: avoid; margin: 0 0 6px; }
  .specs ul { margin: 2px 0 0; padding-left: 18px; color: var(--muted); font-size: .9rem; }
  .dl-row { display: grid; gap: 10px; margin-bottom: 12px; }
  .dl { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; }
  .dl-btns { display: flex; gap: 8px; }
  .videos { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; }
  .video { position: relative; display: block; border-radius: 10px; overflow: hidden; text-decoration: none; }
  .video img { width: 100%; display: block; aspect-ratio: 16 / 9; object-fit: cover; }
  .video span { position: absolute; left: 10px; bottom: 10px; background: rgba(0,0,0,.75); color: #fff; padding: 4px 10px; border-radius: 6px; font-size: .85rem; font-weight: 600; }
  .source { margin-top: 32px; }

  .contact { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 20px; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin-top: 12px; }
  .contact h2 { flex-basis: 100%; margin: 0; font-size: 1.1rem; }

  .bbsku { font-size: .8rem; color: var(--muted); }
  .bbsku strong { color: var(--text); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  .bbsku.big { font-size: .95rem; background: var(--accent-soft); border-radius: 8px; padding: 8px 12px; align-self: flex-start; }

  /* faq + firmware */
  details.faq, details.fw { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; margin-top: 8px; }
  details.fw { border-left: 4px solid var(--line); }
  details.faq summary, details.fw summary { cursor: pointer; padding: 12px 16px; font-weight: 600; }
  details.faq summary .tag { font-weight: 600; font-size: .72rem; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin-left: 6px; }
  details.fw summary small { font-weight: 400; color: var(--muted); }
  .faq-body, .fw-body { padding: 0 16px 14px; font-size: .92rem; }
  .faq-body p { margin: 0 0 6px; }
  .faq-body ol, .fw-body ol { margin: 4px 0 6px; padding-left: 20px; }
  .fw-body h4 { margin: 14px 0 4px; font-size: .95rem; }
  .fw-dl { display: inline-block; margin: 2px 0 6px; font-weight: 600; }
  .ver { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: .85em; background: var(--accent-soft); padding: 1px 5px; border-radius: 4px; }
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <a class="brand" href="#/">Linkswell Product Information</a>
    <nav class="topnav">
      <a href="#/shop" data-nav="shop">Radios</a>
      <a href="#/shop?cat=accessories" data-nav="acc">Accessories</a>
      <a href="#/support" data-nav="support">Support</a>
    </nav>
    <form id="topsearch" role="search">
      <input id="topq" type="search" placeholder="Search vehicles, models or part numbers" aria-label="Search">
    </form>
  </div>
</header>
<main class="wrap" id="app"></main>
<script src="data.js?v=27"></script>
<script src="catalog.js?v=27"></script>
<script src="app.js?v=27"></script>
</body>
</html>
